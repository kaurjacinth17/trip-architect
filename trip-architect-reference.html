function tStays(t){const items=t.plan.flatMap(d=>d.items).filter(x=>geo(x)&&isAct(x));
 const avg=(o,dest)=>{const g=items.filter(x=>x.dest===dest||!dest);if(!g.length||o.lat==null)return null;return sum(g,x=>km(o,x))/g.length};
 const guide=t.dests.map(id=>{const d=D[id];const rows=d.areas.map(a=>({a,v:avg({lat:a[2],lng:a[3]},id)}));const best=rows.filter(r=>r.v!=null).sort((a,b)=>a.v-b.v)[0];return `<div class="card"><h3>Where to stay in ${d.name}</h3><div class="scroll" style="margin-top:10px"><table class="stack"><thead><tr><th>Area</th><th>Best for</th><th class="n">Avg. distance to your plans</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r.a[0]}</b>${r===best?' <span class="tag f">Closest to your plan</span>':''}</td><td>${r.a[1]}</td><td class="n">${r.v!=null?r.v.toFixed(1)+' km':'—'}</td></tr>`).join('')}</tbody></table></div></div>`}).join('');
 const areaOpts=t.dests.flatMap(id=>D[id].areas.map(a=>[`${id}|${a[0]}`,`${a[0]}, ${D[id].name}`]));
 const rooms=Math.ceil(travellers(t)/2);
 return `<div class="grid" style="gap:16px">${guide}</div>
 <section class="sec"><h2>Saved stays</h2><p class="tiny muted" style="margin-top:6px">Trip Architect doesn’t show live hotel inventory or prices. Save options you find on booking sites and compare them here.</p>
 ${t.stays.length?`<div class="scroll" style="margin-top:12px"><table class="stack"><thead><tr><th>Stay</th><th>Area</th><th class="n">Per night</th><th class="n">Nights</th><th class="n">Total (${plural(rooms,'room')})</th><th class="n">To your plans</th><th class="n">Rating</th><th>Status</th><th></th></tr></thead><tbody>${t.stays.map(s=>{const v=avg(s,s.dest);return `<tr><td><b>${esc(s.name)}</b>${s.link?`<br><a class="small" href="${esc(s.link)}" target="_blank" rel="noopener">Booking link</a>`:''}${s.notes?`<br><span class="tiny muted">${esc(s.notes)}</span>`:''}${s.checkin?`<br><span class="tiny muted">${esc(s.checkin)} → ${esc(s.checkout||'')}</span>`:''}</td><td>${esc(s.area)}</td><td class="n">${inr(s.price)}</td><td class="n">${s.nights}</td><td class="n"><b>${inr(s.price*s.nights*rooms)}</b></td><td class="n">${v!=null?v.toFixed(1)+' km':'—'}</td><td class="n">${s.rating?s.rating+'/5':'—'}</td><td><select data-staystatus="${s.id}" aria-label="Booking status" style="min-width:130px">${['idea','shortlisted','booked'].map(x=>`<option ${s.status===x?'selected':''} value="${x}">${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></td><td><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm" data-a="stayBudget" data-v="${s.id}">Use in budget</button><button class="btn sm ghost" data-a="delStay" data-v="${s.id}">Delete</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<p class="small muted" style="margin-top:10px">No stays saved yet.</p>'}</section>
 <section class="sec card grid" style="gap:12px"><h3>Add a stay you’re considering</h3><div class="grid g3" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))"><label class="f">Name<input type="text" id="stName" placeholder="Hotel or homestay"></label><label class="f">Area<select id="stArea">${areaOpts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></label><label class="f">Price per night per room (₹)<input type="number" id="stPrice" min="0" step="100"></label><label class="f">Nights<input type="number" id="stNights" min="1" value="${Math.max(1,t.plan.length-1)}"></label><label class="f">Check-in<input type="date" id="stIn" value="${t.start}"></label><label class="f">Check-out<input type="date" id="stOut"></label><label class="f">Your rating (1–5)<input type="number" id="stRating" min="1" max="5" step="0.5"></label><label class="f">Booking link<input type="url" id="stLink" placeholder="https://"></label></div><label class="f">Notes<input type="text" id="stNotes" placeholder="Breakfast included, free cancellation till…"></label><div><button class="btn pri" data-a="addStay">Save stay</button></div></section>`}

function tPack(t){const cats=[...new Set(t.pack.map(x=>x.cat))];const done=t.pack.filter(x=>x.done).length;const pct=t.pack.length?Math.round(done/t.pack.length*100):0;
 return `<div class="row between"><div><h2>${esc(t.dests.map(id=>D[id]?.name).join(' + '))} packing list</h2><p class="muted small" style="margin-top:6px">${done} of ${t.pack.length} items packed · built from your destinations${t.start?', dates':''} and trip length</p></div><div class="row" style="gap:6px"><button class="btn sm" data-a="packReset">Uncheck all</button><button class="btn sm" data-a="packRegen">Rebuild suggestions</button></div></div>
 <div class="meter" style="margin:14px 0 22px;height:10px"><i style="width:${pct}%"></i></div>
 <div class="grid g2" style="align-items:start">${cats.map(c=>`<div class="card"><div class="row between"><h3>${esc(c)}</h3><span class="tiny muted">${t.pack.filter(x=>x.cat===c&&x.done).length}/${t.pack.filter(x=>x.cat===c).length}</span></div><div style="margin-top:6px">${t.pack.filter(x=>x.cat===c).map(x=>`<label class="check ${x.done?'done':''}"><input type="checkbox" data-pk="${x.id}" ${x.done?'checked':''}><span style="flex:1">${esc(x.name)}</span><input class="q" type="number" min="1" data-pkq="${x.id}" value="${x.qty}" aria-label="Quantity"><button class="btn sm ghost icon" data-a="pkDel" data-v="${x.id}" aria-label="Remove item">×</button></label>`).join('')}</div></div>`).join('')}</div>
 <div class="card row sec" style="gap:10px"><input type="text" id="pkName" placeholder="Add an item" style="flex:2;min-width:180px" aria-label="Item name"><select id="pkCat" style="flex:1;min-width:150px" aria-label="Category">${[...new Set([...cats,'Documents','Clothing','Toiletries','Electronics','Medicines','Essentials','Destination-specific'])].map(c=>`<option>${esc(c)}</option>`).join('')}</select><input type="number" id="pkQty" value="1" min="1" style="width:80px" aria-label="Quantity"><button class="btn pri" data-a="pkAdd">Add item</button></div>`}

function shareText(t){const n=travellers(t);let s=`*${t.name}*\n${t.dests.map(id=>D[id]?.name).join(' → ')} · ${plural(t.plan.length,'day')} · ${plural(n,'traveller')}${t.start?`\n${fmtD(dayDate(t,0))} – ${fmtD(dayDate(t,t.plan.length-1))}`:''}\n`;
 t.plan.forEach((d,i)=>{s+=`\n*Day ${i+1}${dayDate(t,i)?' · '+fmtD(dayDate(t,i)):''}${d.label?' — '+d.label:''}*\n`;[...d.items].sort((a,b)=>a.s-b.s).forEach(x=>{s+=`• ${fmtT(x.s)}  ${x.t}${x.n?` (${x.n})`:''}\n`});if(!d.items.length)s+='• Free day\n'});
 const planned=sum(BCATS,([k])=>t.budget[k]);s+=`\nBudget: ${inr(planned)} planned (${inr(planned/n)} per person)`;const b=t.stays.filter(x=>x.status==='booked');if(b.length)s+=`\nStay: ${b.map(x=>x.name+', '+x.area).join('; ')}`;return s}
function summaryText(t){const n=travellers(t);const planned=sum(BCATS,([k])=>t.budget[k]);return `${t.name}: ${t.dests.map(id=>D[id]?.name).join(' → ')}, ${plural(t.plan.length,'day')}${t.start?' from '+fmtD(dayDate(t,0)):''}, ${plural(n,'traveller')}. Highlights: ${t.plan.flatMap(d=>d.items.filter(x=>x.pri==='must')).map(x=>x.t).slice(0,6).join(', ')||'to be decided'}. Planned budget ${inr(planned)} (${inr(planned/n)} each).`}
function tShare(t){return `<div class="grid g2" style="align-items:start"><div class="grid" style="gap:14px">
 <div class="card grid" style="gap:10px"><h3>Send the itinerary on WhatsApp</h3><p class="small muted">Formatted text with each day’s times, ready to paste into a chat.</p><div class="row"><button class="btn pri" data-a="copy" data-v="wa">Copy itinerary</button><button class="btn" data-a="copy" data-v="sum">Copy short summary</button></div></div>
 <div class="card grid" style="gap:10px"><h3>Print or save as PDF</h3><p class="small muted">A clean, printable version of the whole trip: days, budget, stays and packing list.</p><div class="row"><a class="btn" href="#p-${t.id}">Open print view</a><button class="btn" data-a="dlPrint">Download printable file</button></div></div>
 <div class="card grid" style="gap:10px"><h3>Back up or move this trip</h3><p class="small muted">Export the full trip as a file. Import it later from My trips, on any device.</p><div class="row"><button class="btn" data-a="dlJson">Download trip file (.json)</button><button class="btn" data-a="copy" data-v="json">Copy trip data</button></div></div></div>
 <div class="card"><b class="small">Preview</b><pre style="white-space:pre-wrap;font:14px/1.5 var(--sans);margin:10px 0 0;max-height:520px;overflow:auto">${esc(shareText(t))}</pre></div></div>`}
function printHTML(t){const n=travellers(t);const planned=sum(BCATS,([k])=>t.budget[k]);
 return `<div class="printv"><h1>${esc(t.name)}</h1><p>${t.dests.map(id=>D[id]?.name).join(' → ')} · ${plural(t.plan.length,'day')} · ${plural(n,'traveller')}: ${t.travelers.map(esc).join(', ')}${t.start?` · ${fmtD(dayDate(t,0))} – ${fmtD(dayDate(t,t.plan.length-1))}`:''}</p>
 ${t.plan.map((d,i)=>`<h2 style="margin-top:22px;font-size:20px">Day ${i+1}${dayDate(t,i)?' · '+fmtD(dayDate(t,i)):''}${d.label?' — '+esc(d.label):''}</h2><table><tbody>${[...d.items].sort((a,b)=>a.s-b.s).map(x=>`<tr><td style="width:120px;white-space:nowrap"><b>${fmtT(x.s)}</b><br><span style="font-size:12px;color:#666">${hm(x.d)}</span></td><td><b>${esc(x.t)}</b>${x.area?` · ${esc(x.area)}`:''}${x.c?` · ${inr(x.c)} pp`:''}${x.n?`<br><span style="font-size:13px">${esc(x.n)}</span>`:''}</td></tr>`).join('')||'<tr><td colspan="2">Free day</td></tr>'}</tbody></table>`).join('')}
 <h2 style="margin-top:26px;font-size:20px">Budget</h2><table><tbody>${BCATS.map(([k,l])=>`<tr><td>${l}</td><td class="n" style="text-align:right">${inr(t.budget[k])}</td></tr>`).join('')}<tr><td><b>Total planned</b></td><td style="text-align:right"><b>${inr(planned)}</b> (${inr(planned/n)} pp)</td></tr></tbody></table>
 ${t.stays.length?`<h2 style="margin-top:26px;font-size:20px">Stays</h2><table><tbody>${t.stays.map(s=>`<tr><td><b>${esc(s.name)}</b> · ${esc(s.area)}</td><td>${s.status}</td><td style="text-align:right">${inr(s.price)}/night × ${s.nights}</td></tr>`).join('')}</tbody></table>`:''}
 <h2 style="margin-top:26px;font-size:20px">Packing list</h2><p style="columns:2;font-size:14px">${t.pack.map(x=>`${x.done?'☑':'☐'} ${esc(x.name)}${x.qty>1?' ×'+x.qty:''}`).join('<br>')}</p>
 ${t.notes?`<h2 style="margin-top:26px;font-size:20px">Notes</h2><p style="white-space:pre-wrap">${esc(t.notes)}</p>`:''}<p style="margin-top:26px;font-size:12px;color:#666">Made with Trip Architect. Times, distances and costs are planning estimates.</p></div>`}
function vPrint(t){return `<div class="row noprint" style="margin-bottom:16px"><a class="btn" href="#t-${t.id}-share">← Back to trip</a><button class="btn pri" data-a="print">Print</button><button class="btn" data-a="dlPrint">Download printable file</button><span class="tiny muted">If Print does nothing here, download the file and print it from your browser.</span></div>${printHTML(t)}`}

function vTrips(){const ts=tripList();return `<div class="row between"><h1>My trips</h1><a class="btn pri" href="#new">Create a new trip</a></div>
 <div class="grid auto" style="margin-top:20px">${ts.map(t=>tripCard(t)).join('')||'<div class="empty">No trips yet.</div>'}</div>
 <section class="sec card grid" style="gap:10px"><h3>Import a saved trip</h3><p class="small muted">Choose a trip file exported from Share, or paste its contents.</p><input type="file" id="impFile" accept=".json,application/json" aria-label="Trip file"><textarea id="impText" placeholder="…or paste trip data here"></textarea><div><button class="btn" data-a="importText">Import pasted data</button></div></section>`}

// ---------- modals & toast ----------
function modal(html,wide){$('#layer').innerHTML=`<div class="scrim" data-a="closeModal"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;setTimeout(()=>$('#layer input,#layer select,#layer button')?.focus(),30)}
function closeModal(){$('#layer').innerHTML=''}
let toastT;function toast(msg,undo){clearTimeout(toastT);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-a="undo">Undo</button>':''}`;el.style.display='flex';toastT=setTimeout(()=>el.style.display='none',4200)}
function itemForm(t,x,di,isNew){const cats=Object.entries(CATS).filter(([k])=>k!=='custom'||true);
 return `<h2>${isNew?'Add a custom activity':'Edit activity'}</h2><label class="f">Title<input type="text" id="fT" value="${esc(x.t)}"></label>
 <div class="grid g2"><label class="f">Day<select id="fDay">${t.plan.map((d,i)=>`<option value="${i}" ${i===di?'selected':''}>Day ${i+1}${d.label?' · '+esc(d.label):''}</option>`).join('')}</select></label><label class="f">Type<select id="fCat">${cats.map(([k,c])=>`<option value="${k}" ${x.cat===k?'selected':''}>${c[0]}</option>`).join('')}</select></label>
 <label class="f">Start time<input type="time" id="fS" value="${toHHMM(x.s)}" step="300"></label><label class="f">Duration (minutes)<input type="number" id="fD" min="5" step="15" value="${x.d}"></label>
 <label class="f">Cost per person (₹)<input type="number" id="fC" min="0" step="50" value="${x.c||0}"></label><label class="f">Priority<select id="fP"><option value="must" ${x.pri==='must'?'selected':''}>Must-do</option><option value="nice" ${x.pri!=='must'?'selected':''}>Nice to have</option></select></label></div>
 <label class="f">Notes<textarea id="fN" placeholder="Tickets, meeting point, booking reference">${esc(x.n)}</textarea></label>
 ${x.pid?`<p class="tiny muted">From the ${esc(D[x.dest]?.name)} library · ${esc(PL[x.pid]?.desc||'')}</p>`:''}
 <div class="row between"><div class="row">${isNew?'':`<button class="btn" data-a="delItem" data-v="${x.id}" style="color:var(--alert)">Delete</button><button class="btn" data-a="dupItem" data-v="${x.id}">Duplicate</button><button class="btn" data-a="toWish" data-v="${x.id}">Move to wishlist</button>`}</div><div class="row"><button class="btn" data-a="closeModal">Cancel</button><button class="btn pri" data-a="${isNew?'saveNew':'saveItem'}" data-v="${x.id}">${isNew?'Add to plan':'Save'}</button></div></div>`}

// ---------- mutations ----------
const T=()=>S.trips[S.cur];
function snap(t){(S.undo[t.id]??=[]).push(JSON.stringify(t));if(S.undo[t.id].length>60)S.undo[t.id].shift()}
function mut(fn,msg,undoable){const t=T();if(!t)return;snap(t);const r=fn(t);if(r===false){S.undo[t.id].pop();return}persist(t);render();if(msg)toast(typeof msg==='function'?msg():msg,undoable)}
function undo(){const t=T();const st=S.undo[t?.id];if(!st?.length)return toast('Nothing to undo');S.trips[t.id]=JSON.parse(st.pop());persist(S.trips[t.id]);render();toast('Undone')}
function findItem(t,id){for(let i=0;i<t.plan.length;i++){const j=t.plan[i].items.findIndex(x=>x.id===id);if(j>=0)return{di:i,day:t.plan[i],x:t.plan[i].items[j],j}}return null}
function pullItem(t,id){const f=findItem(t,id);if(!f)return null;f.day.items.splice(f.j,1);return f}
const trm=(a,b)=>geo(a)&&geo(b)?travelMin(km(a,b)):0;
function cascadeOrdered(day){const it=day.items;for(let i=1;i<it.length;i++){const a=it[i-1],b=it[i];const m=a.s+a.d+trm(a,b);if(b.s<m)b.s=up5(m)}}
function startFor(t,day,x){return nextSlot(day,x)??(PACE[t.pace]||PACE.balanced).start}
function placeOnDay(t,di,x,at){const day=t.plan[di];if(at!=null)x.s=at;else x.s=startFor(t,day,x);if(!x.dest)x.dest=day.dest;day.items.push(x);cascade(day)}
function lightest(t,exclude,dest){let best=-1,bv=1e9;t.plan.forEach((d,i)=>{if(i===exclude)return;if(dest&&t.dests.length>1&&d.dest!==dest)return;const v=dayStats(d).actMin;if(v<bv){bv=v;best=i}});return best}
const FIXES={
 moveOut(t,f){const day=t.plan[f.di];const cand=dayStats(day).acts.filter(x=>!x.done).sort((a,b)=>(a.pri==='must')-(b.pri==='must')||b.s-a.s).slice(0,f.v);const moved=[];
  for(const x of cand){const tgt=lightest(t,f.di,x.dest);if(tgt<0)break;pullItem(t,x.id);placeOnDay(t,tgt,x);moved.push(`${x.t} → Day ${tgt+1}`)}cascade(day);return moved.length?`Moved ${moved.join(', ')}`:false},
 cascade(t,f){cascade(t.plan[f.di]);return 'Later items pushed back'},
 addTransit(t,f){const day=t.plan[f.di];sortDay(day);const i=day.items.findIndex(x=>x.id===f.id);const prev=day.items[i-1];const s=prev?prev.s+prev.d:day.items[i].s;const b=day.items[i];day.items.splice(i,0,customItem({t:`Travel to ${b.area||D[b.dest]?.name||'next stop'}`,cat:'transit',s:up5(s),d:f.v,dest:b.dest}));cascadeOrdered(day);return 'Travel block added'},
 breakAfter(t,f){const day=t.plan[f.di];const a=day.items.find(x=>x.id===f.id);day.items.push(customItem({t:'Break',cat:'rest',s:a.s+a.d,d:30,dest:a.dest}));sortDay(day);const i=day.items.findIndex(x=>x.t==='Break'&&x.s===a.s+a.d);const br=day.items.splice(i,1)[0];day.items.splice(day.items.indexOf(a)+1,0,br);cascadeOrdered(day);return 'Break added'},
 addLunch(t,f){const day=t.plan[f.di];sortDay(day);let at=780,best=1e9;for(const x of day.items){const e=x.s+x.d;if(e>=690&&e<=900&&Math.abs(e-780)<best){best=Math.abs(e-780);at=e}}const m=customItem({t:'Lunch',cat:'meal',s:up5(at),d:60,dest:day.dest});const idx=day.items.findIndex(x=>x.s>=at);day.items.splice(idx<0?day.items.length:idx,0,m);cascadeOrdered(day);return 'Lunch added; later items moved back'},
 route(t,f){return routeOrder(t.plan[f.di])?'Reordered by distance':false},
 toEvening(t,f){const g=findItem(t,f.id);g.x.s=Math.max(1005,g.x.s);cascade(g.day);return `${g.x.t} moved to the evening`},
 moveTo(t,f){const g=pullItem(t,f.id);placeOnDay(t,f.v,g.x);return `Moved to Day ${f.v+1}`},
 setAct(t,f){t.budget.act=f.v;return 'Activities budget updated'}};
function runFix(f){if(f.a==='ptab'){S.ui.ptab=f.v;return render()}let msg;mut(t=>{msg=FIXES[f.a](t,f);return msg},()=>msg,true)}

// ---------- drag and drop ----------
function clearMarks(){document.querySelectorAll('.over-top,.over-bot,.drop').forEach(e=>e.classList.remove('over-top','over-bot','drop'))}
document.addEventListener('dragstart',e=>{const el=e.target.closest?.('[data-drag]');if(!el)return;S.drag={k:el.dataset.drag,id:el.dataset.id};e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',el.dataset.id)}catch(_){}requestAnimationFrame(()=>el.classList.add('dragging'))});
document.addEventListener('dragend',()=>{S.drag=null;clearMarks();document.querySelectorAll('.dragging').forEach(e=>e.classList.remove('dragging'))});
document.addEventListener('dragover',e=>{if(!S.drag)return;const blk=e.target.closest('.blk'),dayb=e.target.closest('[data-dropday]'),wish=e.target.closest('[data-dropwish]'),list=e.target.closest('[data-droplist]');
 if(!(blk||dayb||list||(wish&&S.drag.k==='item')))return;e.preventDefault();clearMarks();
 if(blk&&blk.dataset.id!==S.drag.id){const r=blk.getBoundingClientRect();blk.classList.add(e.clientY<r.top+r.height/2?'over-top':'over-bot')}else if(dayb)dayb.classList.add('drop')});
document.addEventListener('drop',e=>{if(!S.drag)return;const d=S.drag;const blk=e.target.closest('.blk'),dayb=e.target.closest('[data-dropday]'),wish=e.target.closest('[data-dropwish]'),list=e.target.closest('[data-droplist]');
 if(!(blk||dayb||list||wish))return;e.preventDefault();const before=blk?.classList.contains('over-top');clearMarks();S.drag=null;
 if(wish&&!blk&&!dayb&&d.k==='item')return mut(t=>{const f=pullItem(t,d.id);t.wish.push(f.x)},'Moved to wishlist',true);
 const di=dayb?+dayb.dataset.dropday:S.sel.day??0;const refId=blk&&!dayb?blk.dataset.id:null;if(refId===d.id)return;
 mut(t=>{let x;if(d.k==='item')x=pullItem(t,d.id)?.x;else if(d.k==='lib')x=itemFromPlace(PL[d.id]);else{const i=t.wish.findIndex(w=>w.id===d.id);x=i>=0?t.wish.splice(i,1)[0]:null}
  if(!x)return false;const day=t.plan[di];if(!x.dest)x.dest=day.dest;sortDay(day);
  if(refId){const idx=day.items.findIndex(y=>y.id===refId);const ref=day.items[idx];
   if(before){const prev=day.items[idx-1];x.s=prev?up5(prev.s+prev.d+trm(prev,x)):Math.max(360,up5(ref.s-x.d-trm(x,ref)));day.items.splice(idx,0,x)}
   else{x.s=up5(ref.s+ref.d+trm(ref,x));day.items.splice(idx+1,0,x)}cascadeOrdered(day)}
  else{x.s=startFor(t,day,x);day.items.push(x);cascade(day)}},dayb?`Moved to Day ${di+1}`:null,true)});

// ---------- clicks ----------
function val(id){return $('#'+id)?.value??''}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Copied')}catch(e){modal(`<h2>Copy this text</h2><p class="small muted">Your browser blocked automatic copying. Select all and copy.</p><textarea style="min-height:280px" readonly>${esc(s)}</textarea><div class="row"><button class="btn pri" data-a="closeModal">Done</button></div>`);setTimeout(()=>{const ta=$('#layer textarea');ta?.focus();ta?.select()},50)}}
async function saveFile(filename,data){try{const dl=await window.claude?.use?.('downloads');if(!dl)throw{code:'unavailable'};await dl.save({filename,data});toast('Saved')}catch(e){if(e?.code==='declined')return;if(filename.endsWith('.json'))return copyText(data);toast('Downloads aren’t available here; use Print view instead')}}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'trip';
function importTrip(raw){try{const o=JSON.parse(raw);const t=o.trip||o;if(!Array.isArray(t.plan)||!Array.isArray(t.dests)||!t.name)throw 0;t.id=uid();t.sample=false;t.wish??=[];t.expenses??=[];t.stays??=[];t.pack??=[];t.budget??={};t.travelers??=['You'];t.pace=PACE[t.pace]?t.pace:'balanced';t.notes??='';t.dests=t.dests.filter(id=>D[id]);
 if(Object.values(S.trips).some(x=>x.name===t.name))t.name+=' (imported)';S.trips[t.id]=t;persist(t);location.hash='t-'+t.id;toast('Trip imported')}catch(e){toast('That doesn’t look like a Trip Architect file')}}
const H={
 go:(v)=>location.hash=v,noprop:()=>{},closeModal,undo,print:()=>{try{window.print()}catch(e){toast('Printing isn’t available here; download the printable file')}},
 mood:(v)=>{S.ui.mood=v||null;if(!S.route.startsWith('explore'))location.hash='explore';else render()},
 cmpToggle:(v)=>{const c=S.ui.cmp;const i=c.indexOf(v);if(i>=0)c.splice(i,1);else{if(c.length>=4)c.shift();c.push(v)}saveLocal();render()},
 lcat:(v)=>{S.ui.lcat=v;render()},ptab:(v)=>{S.ui.ptab=v;render()},day:(v)=>{S.sel.day=+v;S.sel.slot=null;render()},
 gotoDay:(v)=>{S.sel.day=+v;S.ui.ptab='checks';const h=`t-${S.cur}-plan`;if(location.hash.slice(1)===h)render();else location.hash=h},
 slot:(v)=>{S.sel.slot=+v;S.ui.ptab='lib';render()},slotClear:()=>{S.sel.slot=null;render()},
 mapDay:(v)=>{S.ui.mapDay=v==='all'?'all':+v;S.sel.pin=null;render()},
 fix:(v)=>runFix(FIX[+v]),
 done:(v)=>mut(t=>{const f=findItem(t,v);f.x.done=!f.x.done}),
 dur:(v,el)=>mut(t=>{const f=findItem(t,v);f.x.d=Math.max(15,f.x.d+ +el.dataset.d);cascade(f.day)}),
 nudge:(v,el)=>mut(t=>{const f=findItem(t,v);sortDay(f.day);const it=f.day.items;const i=it.indexOf(f.x),j=i+ +el.dataset.d;if(j<0||j>=it.length)return false;const s0=Math.min(it[i].s,it[j].s);[it[i],it[j]]=[it[j],it[i]];it[Math.min(i,j)].s=s0;cascadeOrdered(f.day)}),
 dupItem:(v)=>{closeModal();mut(t=>{const f=findItem(t,v);const c={...clone(f.x),id:uid(),s:f.x.s+f.x.d};f.day.items.splice(f.j+1,0,c);cascadeOrdered(f.day)},'Duplicated',true)},
 toWish:(v)=>{closeModal();mut(t=>{const f=pullItem(t,v);t.wish.push(f.x)},'Moved to wishlist',true)},
 delItem:(v)=>{closeModal();mut(t=>{if(!pullItem(t,v)){const i=t.wish.findIndex(w=>w.id===v);if(i>=0)t.wish.splice(i,1)}},'Activity deleted',true)},
 edit:(v)=>{const t=T();const f=findItem(t,v);modal(itemForm(t,f.x,f.di,false))},
 addCustom:()=>{const t=T();const di=S.sel.day??0;const day=t.plan[di];const x=customItem({dest:day.dest});x.s=S.sel.slot??startFor(t,day,x);modal(itemForm(t,x,di,true));S.draft=x},
 saveItem:(v)=>{const s=fromHHMM(val('fS')),di=+val('fDay');closeModal();mut(t=>{const f=findItem(t,v);const x=f.x;Object.assign(x,{t:val('fT').trim()||x.t,cat:val('fCat'),d:Math.max(5,+val('fD')||x.d),c:Math.max(0,+val('fC')||0),pri:val('fP'),n:val('fN').trim(),s});if(di!==f.di){pullItem(t,v);t.plan[di].items.push(x);cascade(t.plan[di])}else cascade(f.day)},'Saved')},
 saveNew:()=>{const x=S.draft;const di=+val('fDay');Object.assign(x,{t:val('fT').trim()||'Custom activity',cat:val('fCat'),d:Math.max(5,+val('fD')||60),c:Math.max(0,+val('fC')||0),pri:val('fP'),n:val('fN').trim(),s:fromHHMM(val('fS'))});closeModal();S.sel.slot=null;mut(t=>{t.plan[di].items.push(x);cascade(t.plan[di])},'Added to Day '+(di+1),true)},
 libAdd:(v)=>{const di=S.sel.day??0;const at=S.sel.slot;S.sel.slot=null;mut(t=>{placeOnDay(t,di,itemFromPlace(PL[v]),at)},`${PL[v].n} added to Day ${di+1}`,true)},
 libWish:(v)=>mut(t=>{if(t.wish.some(w=>w.pid===v))return false;t.wish.push(itemFromPlace(PL[v]))},'Saved to wishlist'),
 wishAdd:(v)=>{const di=S.sel.day??0;const at=S.sel.slot;S.sel.slot=null;mut(t=>{const i=t.wish.findIndex(w=>w.id===v);const x=t.wish.splice(i,1)[0];placeOnDay(t,di,x,at)},`Added to Day ${di+1}`,true)},
 wishDel:(v)=>mut(t=>{t.wish=t.wish.filter(w=>w.id!==v)},'Removed from wishlist',true),
 tidy:()=>mut(t=>{const day=t.plan[S.sel.day??0];if(!day.items.length)return false;tidy(day)},'Times tidied',true),
 route:()=>mut(t=>routeOrder(t.plan[S.sel.day??0])?undefined:(toast('Needs at least three mapped places'),false),'Reordered by distance',true),
 clearDay:()=>mut(t=>{const day=t.plan[S.sel.day??0];if(!day.items.length)return false;t.wish.push(...day.items.filter(isAct));day.items=[]},'Day cleared; activities moved to wishlist',true),
 dayCount:(v)=>mut(t=>{if(+v>0){const last=t.plan[t.plan.length-1];t.plan.push({dest:last?.dest||t.dests[0],label:'',items:[]})}else{if(t.plan.length<2)return false;const d=t.plan.pop();t.wish.push(...d.items.filter(isAct));if((S.sel.day??0)>=t.plan.length)S.sel.day=t.plan.length-1}t.days=t.plan.length},+v>0?'Day added':'Last day removed; its activities are in the wishlist',true),
 travAdd:()=>mut(t=>{t.travelers.push('Traveller '+(t.travelers.length+1))}),
 travDel:(v)=>mut(t=>{const i=+v;if(t.travelers.length<2)return false;t.travelers.splice(i,1);for(const e of t.expenses){if(e.paid===i)e.paid=0;else if(e.paid>i)e.paid--;e.among=(e.among||[]).filter(k=>k!==i).map(k=>k>i?k-1:k)}},'Traveller removed',true),
 dupTrip:()=>{const t=clone(T());t.id=uid();t.name+=' (copy)';t.sample=false;S.trips[t.id]=t;persist(t);location.hash='t-'+t.id;toast('Trip duplicated')},
 delTrip:()=>modal(`<h2>Delete “${esc(T().name)}”?</h2><p>This removes the itinerary, budget, stays and packing list. It can’t be undone; export it from Share first if you might want it back.</p><div class="row"><button class="btn" data-a="closeModal">Keep trip</button><button class="btn acc" data-a="delTripYes">Delete trip</button></div>`),
 delTripYes:()=>{const id=S.cur;delete S.trips[id];delete S.undo[id];saveLocal();queueRemote(id);closeModal();location.hash='trips';toast('Trip deleted')},
 addToTrip:(v)=>{const ts=tripList();modal(`<h2>Add ${esc(PL[v].n)}</h2><p class="small muted">It goes into the trip’s wishlist, ready to drop onto a day.</p><div class="grid" style="gap:8px">${ts.map(t=>`<button class="opt" data-a="addToTripGo" data-v="${t.id}" data-p="${v}"><b>${esc(t.name)}</b><span class="small muted">${t.dests.map(id=>D[id]?.name).join(' → ')}${t.dests.includes(PL[v].dest)?'':' · will add '+D[PL[v].dest].name}</span></button>`).join('')}<a class="btn pri" href="#new-${PL[v].dest}" data-a="closeModal">Start a new ${D[PL[v].dest].name} trip</a></div>`)},
 addToTripGo:(v,el)=>{const t=S.trips[v],p=PL[el.dataset.p];snap(t);if(!t.dests.includes(p.dest))t.dests.push(p.dest);if(!t.wish.some(w=>w.pid===p.pid))t.wish.push(itemFromPlace(p));persist(t);closeModal();toast(`Saved to the wishlist in ${t.name}`);paintSide()},
 reEst:()=>mut(t=>{const e=estBudget(t);for(const k in e)if(k!=='travel')t.budget[k]=e[k]},'Categories re-estimated (travel kept)',true),
 addExp:()=>{const amt=+val('exAmt');if(!(amt>0))return toast('Enter an amount');const among=[...document.querySelectorAll('.exAmong:checked')].map(c=>+c.value);mut(t=>{t.expenses.push({id:uid(),amt,cat:val('exCat'),date:val('exDate'),paid:+val('exPaid'),among,note:val('exNote').trim()})},'Expense added',true)},
 delExp:(v)=>mut(t=>{t.expenses=t.expenses.filter(e=>e.id!==v)},'Expense deleted',true),
 addStay:()=>{const name=val('stName').trim();if(!name)return toast('Give the stay a name');const[dest,area]=val('stArea').split('|');const a=D[dest]?.areas.find(x=>x[0]===area);const link=val('stLink').trim();
  mut(t=>{t.stays.push({id:uid(),name,area,dest,lat:a?.[2]??null,lng:a?.[3]??null,price:+val('stPrice')||0,nights:Math.max(1,+val('stNights')||1),checkin:val('stIn'),checkout:val('stOut'),rating:+val('stRating')||0,link:/^https?:\/\//i.test(link)?link:'',notes:val('stNotes').trim(),status:'shortlisted'})},'Stay saved')},
 delStay:(v)=>mut(t=>{t.stays=t.stays.filter(s=>s.id!==v)},'Stay deleted',true),
 stayBudget:(v)=>mut(t=>{const s=t.stays.find(x=>x.id===v);t.budget.stay=s.price*s.nights*Math.ceil(travellers(t)/2)},'Stay budget updated',true),
 pkDel:(v)=>mut(t=>{t.pack=t.pack.filter(x=>x.id!==v)}),
 pkAdd:()=>{const name=val('pkName').trim();if(!name)return;mut(t=>{t.pack.push({id:uid(),cat:val('pkCat'),name,qty:Math.max(1,+val('pkQty')||1),done:false,custom:true})})},
 packReset:()=>mut(t=>{t.pack.forEach(x=>x.done=false)},'All items unchecked',true),
 packRegen:()=>mut(t=>{const old=new Map(t.pack.map(x=>[x.name,x]));const fresh=genPack(t).map(x=>old.has(x.name)?{...x,done:old.get(x.name).done,qty:old.get(x.name).qty}:x);t.pack=fresh.concat(t.pack.filter(x=>x.custom))},'Suggestions rebuilt; your own items kept',true),
 copy:(v)=>{const t=T();copyText(v==='wa'?shareText(t):v==='sum'?summaryText(t):JSON.stringify({app:'trip-architect',version:1,trip:t},null,2))},
 dlJson:()=>{const t=T();saveFile(slug(t.name)+'.json',JSON.stringify({app:'trip-architect',version:1,trip:t},null,2))},
 dlPrint:()=>{const t=T();saveFile(slug(t.name)+'-itinerary.html',`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(t.name)}</title><style>body{font:15px/1.5 Georgia,serif;max-width:760px;margin:32px auto;padding:0 16px;color:#111}h1{font-size:32px;margin:0 0 6px}h2{font-size:20px}table{width:100%;border-collapse:collapse}td{padding:6px 8px;border-bottom:1px solid #ddd;vertical-align:top}</style></head><body>${printHTML(t)}</body></html>`)},
 importText:()=>importTrip(val('impText')),
 wzDest:(v)=>{const w=S.wz;const i=w.dests.indexOf(v);if(i>=0)w.dests.splice(i,1);else w.dests.push(v);if(w.dests.length)w.days=Math.max(w.days,Math.min(14,sum(w.dests,id=>D[id].days[0])));render()},
 wzDays:(v)=>{S.wz.days=Math.max(1,Math.min(14,S.wz.days+ +v));render()},
 wzGroup:(v)=>{const w=S.wz;w.group=v;w.n=GROUPS.find(g=>g[0]===v)[2];w.names=Array.from({length:w.n},(_,i)=>w.names[i]||'');render()},
 wzN:(v)=>{const w=S.wz;w.n=Math.max(1,Math.min(12,w.n+ +v));w.names=Array.from({length:w.n},(_,i)=>w.names[i]||'');if(w.n===1)w.group='solo';render()},
 wzPace:(v)=>{S.wz.pace=v;render()},wzBMode:(v)=>{S.wz.bMode=v;render()},
 wzStep:(v)=>{S.wz.step=Math.max(1,Math.min(6,S.wz.step+ +v));render();window.scrollTo(0,0)},
 wzCreate:()=>{const w=S.wz;const travelers=w.names.map((x,i)=>x.trim()||(i===0?'You':`Traveller ${i+1}`));const b=+w.budget||0;
  const t=buildTrip({dests:w.dests,start:w.start,days:w.days,group:w.group,travelers,pace:w.pace,prefs:w.prefs,budgetTotal:w.bMode==='total'?b:b*w.n,name:w.name.trim()});
  S.trips[t.id]=t;persist(t);S.wz=null;S.sel.day=0;S.ui.ptab='checks';location.hash=`t-${t.id}-plan`;toast('Trip created. Everything here is editable.')}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(a==='closeModal'&&el.classList.contains('scrim')&&e.target!==el)return;if(a!=='noprop'&&el.tagName!=='A')e.preventDefault();const f=H[a];if(f)f(el.dataset.v,el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.closest('input,textarea,select')&&S.route.startsWith('t-')){e.preventDefault();undo()}
 if(e.key==='Enter'&&e.target.matches('.dcard[data-a]'))H.go(e.target.dataset.v)});

// ---------- inputs ----------
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='q'){S.ui.q=el.value;render()}else if(el.id==='lq'){S.ui.lq=el.value;render()}
 else if(el.dataset.wzname!=null)S.wz.names[+el.dataset.wzname]=el.value;
 else if(el.id==='wzBudget')S.wz.budget=el.value;else if(el.id==='wzName')S.wz.name=el.value;
 else if(el.dataset.pref)S.wz.prefs[el.dataset.pref]=+el.value});
document.addEventListener('change',e=>{const el=e.target;const t=T();
 if(el.id==='len'){S.ui.len=el.value;render()}
 else if(el.id==='cmpMonth'){S.ui.cmpMonth=+el.value;render()}
 else if(el.dataset.w){S.ui.w[el.dataset.w]=+el.value;saveLocal();render()}
 else if(el.id==='wzStart'){S.wz.start=el.value;render()}
 else if(el.id==='impFile'){const f=el.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>importTrip(String(r.result));r.readAsText(f)}
 else if(!t||!S.route.startsWith('t-'))return;
 else if(el.dataset.tf){const k=el.dataset.tf;mut(t=>{if(k==='budgetTotal')t.budgetTotal=Math.max(0,+el.value||0);else if(k==='name')t.name=el.value.trim()||t.name;else t[k]=el.value;if(k==='start'||k==='pace')t.pack=t.pack})}
 else if(el.dataset.trav!=null)mut(t=>{t.travelers[+el.dataset.trav]=el.value.trim()||`Traveller ${+el.dataset.trav+1}`});
 else if(el.dataset.daylabel!=null)mut(t=>{t.plan[+el.dataset.daylabel].label=el.value.trim()});
 else if(el.dataset.daydest!=null)mut(t=>{t.plan[+el.dataset.daydest].dest=el.value});
 else if(el.dataset.bud)mut(t=>{t.budget[el.dataset.bud]=Math.max(0,+el.value||0)});
 else if(el.dataset.staystatus)mut(t=>{t.stays.find(s=>s.id===el.dataset.staystatus).status=el.value});
 else if(el.dataset.pk)mut(t=>{const x=t.pack.find(p=>p.id===el.dataset.pk);x.done=el.checked});
 else if(el.dataset.pkq)mut(t=>{t.pack.find(p=>p.id===el.dataset.pkq).qty=Math.max(1,+el.value||1)});
 else if(el.dataset.layer){S.ui.mapLayers[el.dataset.layer]=el.checked?1:0;render()}});

// ---------- router ----------
let lastRoute='';S.mv={};
function render(){const h=decodeURIComponent((location.hash||'#home').slice(1))||'home';S.route=h;const[r,...rest]=h.split('-');
 const ae=document.activeElement;const fk=ae&&ae.id&&ae!==document.body?ae.id:null;const sel=fk&&typeof ae.selectionStart==='number'?[ae.selectionStart,ae.selectionEnd]:null;
 let html;
 if(r==='home')html=vHome();else if(r==='explore')html=vExplore();else if(r==='d')html=vDest(D[rest[0]]);else if(r==='compare')html=vCompare();else if(r==='trips')html=vTrips();
 else if(r==='new'){const pre=rest[0]||'';if(!S.wz||S.wz.pre!==pre){newWz(pre);S.wz.pre=pre}html=vNew()}
 else if(r==='t'||r==='p'){const t=S.trips[rest[0]];if(!t)html=vMissing();else{if(S.cur!==t.id){S.sel={day:0};S.ui.mapDay='all'}S.cur=t.id;html=r==='p'?vPrint(t):vTrip(t,rest[1]||'overview')}}
 else html=vMissing();
 $('#main').innerHTML=html;paintSide();
 if(r==='d'&&D[rest[0]]){const d=D[rest[0]];const k='d'+d.id;S.mv[k]??={};mountMap($('#dmap'),{view:S.mv[k],pts:d.pl.map(p=>({id:p.pid,lat:p.lat,lng:p.lng,col:CATS[p.cat][1],lab:p.n,num:''})),areas:d.areas.map(a=>({name:a[0],lat:a[2],lng:a[3]})),labels:true,onPick:id=>{const p=PL[id];modal(`<h2>${esc(p.n)}</h2><p class="small muted">${CATS[p.cat][0]} · ${esc(p.area)} · ${hm(p.d)} · ${p.c?inr(p.c)+' pp':'Free'}</p><p>${esc(p.desc)}</p><div class="row"><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">Open in Google Maps</a><button class="btn pri" data-a="addToTrip" data-v="${p.pid}">Add to my trip</button></div>`)}})}
 if(r==='t'&&rest[1]==='map'&&S.mapData){const k=S.cur+'-'+S.ui.mapDay;S.mv[k]??={};mountMap($('#tmap'),{...S.mapData,view:S.mv[k],onPick:id=>{S.sel.pin=id;render()}})}
 if(fk){const el=document.getElementById(fk);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(...sel)}catch(_){}}}
 if(h!==lastRoute){const base=h.split('-').slice(0,2).join('-'),lb=lastRoute.split('-').slice(0,2).join('-');if(base!==lb)window.scrollTo(0,0);lastRoute=h}}
window.addEventListener('hashchange',render);

// ---------- start ----------
loadLocal();
if(!Object.keys(S.trips).length){const d=new Date();d.setDate(d.getDate()+21);const start=d.toISOString().slice(0,10);
 const t=buildTrip({dests:['jaipur'],days:4,start,travelers:['You','Riya'],group:'couple',pace:'balanced',prefs:{natureCity:0,sightExp:0,foodShop:0,advComfort:0,tier:1},budgetTotal:25000,name:'Jaipur getaway'});
 t.sample=true;t.budget.travel=3000;
 t.stays=[{id:uid(),name:'Old City haveli (sample)',area:'Old City',dest:'jaipur',lat:26.9235,lng:75.8250,price:3800,nights:3,checkin:start,checkout:'',rating:4.5,link:'',notes:'Rooftop with fort views',status:'shortlisted'},{id:uid(),name:'C-Scheme boutique hotel (sample)',area:'C-Scheme',dest:'jaipur',lat:26.905,lng:75.806,price:4600,nights:3,checkin:start,checkout:'',rating:4,link:'',notes:'Near cafés, quieter at night',status:'idea'}];
 t.expenses=[{id:uid(),amt:2380,cat:'travel',date:new Date().toISOString().slice(0,10),paid:0,among:[0,1],note:'Train tickets (sample)'}];
 const d3=t.plan[2];if(d3){const p=PL['jaipur:chokhi'];if(!d3.items.some(x=>x.pid===p.pid)){d3.items.push(itemFromPlace(p,1080));sortDay(d3)}}
 S.trips[t.id]=t;saveLocal()}
render();startRemote();

}
</script>
</body>
</html>
