<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Architect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, competent travel consultant; warm, never salesy; honest about estimates.
   IDEA: a planner's field journal: day pages, hanging times, pinned places, a ledger at the back.
   PICTURE: illustrated destination scenes, and the live day timeline itself inside a trip.
   COLOUR and TYPE: cream paper, deep forest green, terracotta accent (the user's brief); Fraunces headings, Manrope body.
   LAYOUT: left rail of trips; main sheet; inside a trip, day rail, timeline and a side panel of checks. */
:root{color-scheme:light dark;
--bg:light-dark(#f4eee2,#111915);--paper:light-dark(#fffaf2,#18221d);--sand:light-dark(#ece2ce,#212d27);
--ink:light-dark(#1c2a22,#ece6d8);--mute:light-dark(#5b675e,#a7b1a6);--line:light-dark(#e1d6c1,#2c3a33);
--forest:light-dark(#1f4d3a,#8cc4a6);--side:light-dark(#1f4d3a,#162a21);--on-forest:light-dark(#fffaf2,#0e1712);--forest-soft:light-dark(#dfe9e0,#1f3229);
--terra:light-dark(#b4532a,#e8915f);--terra-soft:light-dark(#f6e0d2,#3a261c);
--alert:light-dark(#a8261c,#ff8f84);--alert-soft:light-dark(#f8e1dd,#3b1d1a);
--caution:light-dark(#8a5a00,#f0b452);--caution-soft:light-dark(#f7ead0,#3a2e15);
--shadow:0 1px 2px rgba(30,40,30,.06),0 6px 20px rgba(30,40,30,.06);
--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(32px,4.4vw,48px)}h2{font-size:clamp(24px,2.6vw,30px)}h3{font-size:19px}
p{margin:0}a{color:var(--forest)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);color:#f4eee2;padding:22px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;text-decoration:none;color:inherit}
.brand b{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;font-size:12px;opacity:.75}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:600;font-size:15px;min-height:44px}
.nav a:hover{background:rgba(255,255,255,.08)}.nav a.on{background:#f4eee2;color:#1f4d3a}
.nav svg{width:18px;height:18px;flex:none}
.side .lab{font-size:13px;opacity:.7;padding:18px 10px 6px}
.side .tl a{font-weight:500;font-size:14px}
.side .tl a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.6;flex:none}
.main{padding:clamp(20px,3vw,40px) clamp(16px,3.5vw,48px) 80px;max-width:1320px;width:100%}
.top{display:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--mute)}.small{font-size:14px}.tiny{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--forest)}
.btn.pri{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}
.btn.acc{background:var(--terra);color:#fff;border-color:var(--terra)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.icon{width:40px;padding:0;min-height:40px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px;font-weight:600;min-height:38px;white-space:nowrap}
.chip{text-decoration:none;color:var(--ink)}
.chip.on{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--sand);font-size:13px;font-weight:600;white-space:nowrap}
.tag.t{background:var(--terra-soft);color:var(--terra)}.tag.f{background:var(--forest-soft);color:var(--forest)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input:not([type]),select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px}
textarea{min-height:80px;resize:vertical}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--forest)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--forest)}
.sec{margin-top:36px}.sec>h2{margin-bottom:14px}
.kicker{font-size:14px;color:var(--terra);font-weight:700}
.scene{display:block;width:100%;height:100%}
.dcard{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left}
.dcard .art{height:150px;background:var(--sand)}
.dcard .bd{padding:14px 16px 16px;display:grid;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0;border-radius:18px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero .txt{padding:clamp(22px,3.5vw,40px);display:flex;flex-direction:column;gap:16px;justify-content:center}
.hero .art{min-height:300px}
.meter{height:8px;border-radius:99px;background:var(--sand);overflow:hidden}.meter i{display:block;height:100%;background:var(--forest);border-radius:99px}
.meter.warn i{background:var(--caution)}.meter.bad i{background:var(--alert)}
.stat b{display:block;font-family:var(--serif);font-size:clamp(24px,3vw,34px);font-weight:600;line-height:1.1}
.stat span{font-size:14px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
/* trip workspace */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 22px;scrollbar-width:none}
.tabs a{flex:none;padding:12px 14px;font-weight:700;font-size:15px;color:var(--mute);text-decoration:none;border-bottom:3px solid transparent;min-height:44px}
.tabs a.on{color:var(--forest);border-color:var(--terra)}
.tabs a .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--alert);color:#fff;font-size:12px;text-align:center}
.studio{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:20px;align-items:start}
.rail{display:grid;gap:8px;position:sticky;top:16px}
.dayb{display:grid;gap:6px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);min-height:44px}
.dayb.on{border-color:var(--forest);box-shadow:inset 3px 0 0 var(--terra)}
.dayb.drop{background:var(--forest-soft);border-style:dashed}
.dayb b{font-family:var(--serif);font-size:17px}.dayb .lbl{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flags{display:flex;gap:4px}.flags i{font-style:normal;font-size:12px;font-weight:700;padding:0 6px;border-radius:99px}
.flags .a{background:var(--alert-soft);color:var(--alert)}.flags .c{background:var(--caution-soft);color:var(--caution)}
.dayhead{display:grid;gap:10px;margin-bottom:14px}
.dayhead input.title{font-family:var(--serif);font-size:24px;font-weight:600;border:1px solid transparent;background:transparent;padding:4px 6px;margin-left:-6px}
.dayhead input.title:hover,.dayhead input.title:focus{border-color:var(--line);background:var(--paper)}
.tl{position:relative}
.slot{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;align-items:start}
.time{font-family:var(--serif);font-size:20px;font-weight:600;text-align:right;padding-top:12px;white-space:nowrap;line-height:1}
.time small{display:block;font-family:var(--sans);font-size:12px;color:var(--mute);font-weight:600;margin-top:4px}
.blk{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c,var(--forest));border-radius:12px;padding:12px 12px 10px 14px;display:grid;gap:6px;box-shadow:var(--shadow);cursor:grab}
.blk.done{opacity:.6}.blk.done .bt{text-decoration:line-through}
.blk.dragging{opacity:.35}
.blk.over-top{box-shadow:0 -3px 0 var(--terra)}.blk.over-bot{box-shadow:0 3px 0 var(--terra)}
.blk.flag-a{border-color:var(--alert);border-left-color:var(--alert)}
.bt{font-weight:700;font-size:16px;line-height:1.3}
.bm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.bctl{display:flex;gap:2px;flex-wrap:wrap;align-items:center;margin-top:2px}
.bctl button{border:0;background:transparent;border-radius:6px;min-width:34px;min-height:34px;padding:0 8px;font-size:13px;font-weight:700;color:var(--mute)}
.bctl button:hover{background:var(--sand);color:var(--ink)}
.bnote{font-size:14px;background:var(--sand);border-radius:8px;padding:6px 10px}
.gap{margin:4px 0 4px 100px;font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;padding:4px 0 4px 14px;border-left:2px dotted var(--line);min-height:28px;flex-wrap:wrap}
.gap.bad{color:var(--alert);border-color:var(--alert);font-weight:700}
.gap .free{background:transparent;border:1px dashed var(--line);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--forest);min-height:32px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mute);display:grid;gap:12px;justify-items:center}
.panel{position:sticky;top:16px;display:grid;gap:12px;max-height:calc(100vh - 32px);overflow:auto;padding-bottom:6px}
.ptabs{display:flex;gap:4px;background:var(--sand);padding:4px;border-radius:10px}
.ptabs button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-weight:700;font-size:14px;min-height:40px;color:var(--mute)}
.ptabs button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.warn{border-radius:12px;padding:12px 14px;display:grid;gap:6px;border:1px solid var(--line);background:var(--paper)}
.warn.alert{background:var(--alert-soft);border-color:transparent}.warn.alert b{color:var(--alert)}
.warn.caution{background:var(--caution-soft);border-color:transparent}.warn.caution b{color:var(--caution)}
.warn.tip b{color:var(--forest)}
.warn p{font-size:14px}
.lib{display:grid;gap:8px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.li .nm{font-weight:700;font-size:15px;line-height:1.3}.li .mt{font-size:13px;color:var(--mute)}
.li[draggable=true]{cursor:grab}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.map{position:relative;height:min(68vh,620px);min-height:380px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:light-dark(#eef1e6,#16211c);touch-action:none}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:20px;font-weight:700}
.legend{position:absolute;left:10px;bottom:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,22,18,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--paper);border-radius:16px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-weight:700}
/* wizard */
.steps{display:flex;gap:6px;margin:16px 0 24px}.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}.steps i.on{background:var(--terra)}
.opt{display:grid;gap:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);text-align:left;min-height:44px}
.opt.on{border-color:var(--forest);background:var(--forest-soft);box-shadow:inset 0 0 0 1px var(--forest)}
.opt b{font-size:16px}
.pair{display:grid;grid-template-columns:110px minmax(0,1fr) 110px;gap:12px;align-items:center;font-weight:600;font-size:14px}
.pair span:last-child{text-align:right}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:20px;font-weight:700}
.stepper b{min-width:56px;text-align:center;font-size:18px}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--forest) calc(var(--p)*1%),var(--sand) 0);display:grid;place-items:center;flex:none}
.ring b{width:94px;height:94px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-size:28px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:22px;background:var(--sand);border-radius:6px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--forest);border-radius:6px}
.bar .tr u{position:absolute;top:0;bottom:0;width:2px;background:var(--terra)}
.check{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);min-height:44px}
.check.done span{text-decoration:line-through;color:var(--mute)}
.check .q{width:64px;min-height:36px;padding:4px 8px}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.printv{background:#fff;color:#111;padding:32px;border-radius:12px;font-size:15px}
.printv h1,.printv h2{color:#111}
@media(max-width:1180px){.studio{grid-template-columns:180px minmax(0,1fr)}.panel{grid-column:1/-1;position:static;max-height:none}}
@media(max-width:960px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}
 .top{display:flex;position:sticky;top:0;z-index:20;background:var(--side);color:#f4eee2;padding:10px 14px;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
 .top .brand,.top .nav a{flex:none;white-space:nowrap}.top .brand{padding:0 10px 0 0}.top .brand small{display:none}.top .nav{display:flex;gap:2px}.top .nav a{padding:8px 10px;white-space:nowrap;font-size:14px}
 .hero{grid-template-columns:minmax(0,1fr)}.hero .art{min-height:200px;order:-1}
 .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}
 .mapwrap{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.studio{grid-template-columns:minmax(0,1fr)}.rail{position:static;grid-auto-flow:column;grid-auto-columns:150px;overflow-x:auto;padding-bottom:4px}
 .g2{grid-template-columns:minmax(0,1fr)}.slot{grid-template-columns:64px minmax(0,1fr);gap:10px}.time{font-size:16px}.gap{margin-left:74px}.pair{grid-template-columns:76px minmax(0,1fr) 76px;font-size:13px}.bar{grid-template-columns:90px minmax(0,1fr) 70px}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.blk,.dcard,.opt{transition:transform .15s,box-shadow .15s,border-color .15s}.dcard:hover{transform:translateY(-3px)}}
@media print{.side,.top,.noprint,.tabs{display:none!important}.app{display:block}.main{padding:0}body{background:#fff}.printv{padding:0}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

const fmtD=d=>d?`${WD[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`:'';
function km(a,b){if(a?.lat==null||b?.lat==null)return null;const R=6371,toR=x=>x*Math.PI/180,dLa=toR(b.lat-a.lat),dLo=toR(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

function estPP(d,days,tier=1){const c=d.cost;const act=sum(d.pl.filter(p=>p.must),p=>p.c);return r500(days*(c.stay[tier]/2+c.food[tier]+c.local[tier])+act)}

function queueRemote(id){if(!R.col)return;clearTimeout(R.tm[id]);R.tm[id]=setTimeout(()=>flush(id),1200)}
async function flush(id){if(!R.col)return;if(R.busy[id]){R.again[id]=1;return}R.busy[id]=1;const t=S.trips[id];
 try{const ref=R.col.doc(id);if(!t||t.sample&&!t.touched)await ref.delete();else await ref.set({json:JSON.stringify(t),updated:t.updated||0});R.state='synced'}
 catch(e){R.state=e?.code==='quota_exceeded'?'full':'error'}
 R.busy[id]=0;if(R.again[id]){R.again[id]=0;flush(id)}paintSync()}

async function startRemote(){try{if(!window.claude?.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;
 R.db=db;R.col=db.collection('data/users/'+id);const snap=await R.col.get();let changed=false;const remoteIds=new Set();
 for(const doc of snap.docs){try{const t=JSON.parse(doc.data().json);remoteIds.add(t.id);const l=S.trips[t.id];if(!l||(l.updated||0)<(t.updated||0)){S.trips[t.id]=t;changed=true}}catch(e){}}
 if(remoteIds.size){for(const t of Object.values(S.trips))if(t.sample&&!t.touched&&!remoteIds.has(t.id)){delete S.trips[t.id];changed=true}}
 for(const t of Object.values(S.trips))if(!remoteIds.has(t.id)&&!(t.sample&&!t.touched))queueRemote(t.id);
 R.state='synced';if(changed){saveLocal();render()}else paintSync()}catch(e){R.state='local';paintSync()}}

// ---------- trip model ----------
const isAct=x=>!NONACT.includes(x.cat);
const geo=x=>x&&x.lat!=null&&x.lng!=null;
const sortDay=day=>day.items.sort((a,b)=>a.s-b.s);
function itemFromPlace(p,s){return{id:uid(),pid:p.pid,t:p.n,cat:p.cat,s:s??540,d:p.d,c:p.c,lat:p.lat,lng:p.lng,area:p.area,dest:p.dest,pri:p.must?'must':'nice',n:'',done:false}}
function customItem(o){return Object.assign({id:uid(),pid:null,t:'Custom activity',cat:'custom',s:540,d:60,c:0,lat:null,lng:null,area:'',dest:null,pri:'nice',n:'',done:false},o)}
function cascade(day){sortDay(day);const it=day.items;for(let i=1;i<it.length;i++){const a=it[i-1],b=it[i];const tr=geo(a)&&geo(b)?travelMin(km(a,b)):0;const min=a.s+a.d+tr;if(b.s<min)b.s=up5(min)}}
function tidy(day,start){sortDay(day);const it=day.items;if(!it.length)return;let cur=start??it[0].s;it.forEach((x,i)=>{if(i){const p=it[i-1];cur+=(geo(p)&&geo(x)?travelMin(km(p,x)):0)}x.s=up5(cur);cur=x.s+x.d})}
function nextSlot(day,item){sortDay(day);const last=day.items[day.items.length-1];if(!last)return null;return up15(last.s+last.d+(geo(last)&&geo(item)?travelMin(km(last,item)):0))}
function routeOrder(day){sortDay(day);const it=day.items;const g=it.filter(geo);if(g.length<3)return false;const start=it[0].s;
 const order=[g[0]],left=g.slice(1);while(left.length){const cur=order[order.length-1];let bi=0,bd=1e9;left.forEach((x,i)=>{const d=km(cur,x);if(d<bd){bd=d;bi=i}});order.push(left.splice(bi,1)[0])}
 const res=[];let gi=0;for(const x of it)res.push(geo(x)?order[gi++]:x);
 let cur=start;res.forEach((x,i)=>{if(i){const p=res[i-1];cur+=geo(p)&&geo(x)?travelMin(km(p,x)):0}x.s=up5(cur);cur=x.s+x.d});day.items=res;return true}
function pathKm(list){let s=0;for(let i=1;i<list.length;i++)s+=km(list[i-1],list[i])||0;return s}
function nnKm(g){if(g.length<3)return pathKm(g);const order=[g[0]],left=g.slice(1);while(left.length){const cur=order[order.length-1];let bi=0,bd=1e9;left.forEach((x,i)=>{const d=km(cur,x);if(d<bd){bd=d;bi=i}});order.push(left.splice(bi,1)[0])}return pathKm(order)}
function dayStats(day){const it=[...day.items].sort((a,b)=>a.s-b.s);const acts=it.filter(isAct);const actMin=sum(acts,x=>x.d);let travel=0;for(let i=1;i<it.length;i++){if(geo(it[i-1])&&geo(it[i]))travel+=travelMin(km(it[i-1],it[i]))}
 const W0=540,W1=1260;let busy=0;for(const x of it){busy+=Math.max(0,Math.min(W1,x.s+x.d)-Math.max(W0,x.s))}
 return{it,acts,actMin,travel,free:Math.max(0,720-busy-travel),cost:sum(acts,x=>x.c),first:it[0]?.s,last:it.length?Math.max(...it.map(x=>x.s+x.d)):null}}
const travellers=t=>Math.max(1,t.travelers.length);

// ---------- realism checks ----------
function analyzeDay(t,di){const day=t.plan[di];const W=[];const st=dayStats(day);const{it,acts,actMin}=st;const pace=PACE[t.pace]||PACE.balanced;const N=`Day ${di+1}`;
 const date=dayDate(t,di);const isEdge=(di===0||di===t.plan.length-1)&&t.plan.length>1;const cap=isEdge?Math.round(pace.cap*.75):pace.cap;
 if(!it.length){W.push({lvl:'caution',k:'empty',title:`${N} is empty`,body:'Add places from the library or your wishlist, or keep it as a deliberate rest day.',fix:{l:'Open library',a:'ptab',v:'lib'}});return W}
 if(actMin>cap+45){let over=actMin-cap,k=0;const cand=[...acts].filter(x=>!x.done).sort((a,b)=>(a.pri==='must')-(b.pri==='must')||b.s-a.s);for(const x of cand){if(over<=0)break;over-=x.d;k++}
  W.push({lvl:'alert',k:'over',title:`${N} looks overloaded`,body:`You’ve planned ${plural(acts.length,'activity','activities')} and about ${hm(actMin)} of sightseeing, plus ${hm(st.travel)} getting around. A ${pace.l.toLowerCase()} pace fits roughly ${hm(cap)}${isEdge?' on a travel day':''}. Consider moving ${k} to another day.`,fix:k&&t.plan.length>1?{l:`Move ${k} to lighter days`,a:'moveOut',di,v:k}:null})}
 else if(actMin>cap)W.push({lvl:'caution',k:'heavy',title:`${N} is on the heavy side`,body:`About ${hm(actMin)} of activities against a ${pace.l.toLowerCase()} pace of ${hm(cap)}. Fine if it’s a day you care about.`});
 if(acts.length>pace.max+2&&actMin<=cap+45)W.push({lvl:'caution',k:'many',title:`${plural(acts.length,'stop')} on ${N}`,body:'Lots of short stops add queueing, parking and ticket time that isn’t in the durations.'});
 for(let i=1;i<it.length;i++){const a=it[i-1],b=it[i];const end=a.s+a.d,gap=b.s-end;const d=geo(a)&&geo(b)?km(a,b):null;const tr=travelMin(d);
  if(gap<0){W.push({lvl:'alert',k:'overlap',id:b.id,title:`${b.t} overlaps ${a.t}`,body:`${a.t} runs until ${fmtT(end)} but ${b.t} starts at ${fmtT(b.s)}.`,fix:{l:'Push later items back',a:'cascade',di}});continue}
  if(d!=null&&d>40&&!it.slice(0,i).some(x=>x.cat==='transit'&&x.s>=a.s)){W.push({lvl:'alert',k:'far',id:b.id,title:'Intercity jump',body:`${a.t} and ${b.t} are about ${Math.round(d)} km apart, roughly ${hm(tr)} by road. That’s a travel half-day, not a hop.`,fix:{l:'Add travel block',a:'addTransit',di,id:b.id,v:tr}})}
  else if(d!=null&&gap<tr){W.push({lvl:tr-gap>15?'alert':'caution',k:'transfer',id:b.id,title:`Tight transfer to ${b.t}`,body:`It’s ${d<1.5?Math.round(d*1000)+' m':d.toFixed(1)+' km'} from ${a.t}, about ${tr} min${d<1.5?' on foot':' by auto or cab'}, but you’ve left ${Math.max(0,gap)} min.`,fix:{l:`Start ${b.t} at ${fmtT(up5(end+tr))}`,a:'cascade',di}})}
  if(a.d>=180&&b.d>=120&&isAct(a)&&isAct(b)&&gap<30)W.push({lvl:'caution',k:'fatigue',id:b.id,title:'Long stretch with no break',body:`${hm(a.d)} at ${a.t} straight into ${hm(b.d)} at ${b.t}. Build in a pause.`,fix:{l:'Insert a 30 min break',a:'breakAfter',di,id:a.id}})}
 const fs=st.first,le=st.last;
 if(fs<750&&le>870){const meal=it.some(x=>(x.cat==='meal'||x.cat==='food'||x.cat==='cafe')&&x.s>=690&&x.s<=900||x.cat==='transit'&&x.d>=180&&x.s<=780&&x.s+x.d>=810);let gapOK=false;for(let i=1;i<it.length;i++){const e=it[i-1].s+it[i-1].d;if(it[i].s-e>=60&&e>=690&&e<=870)gapOK=true}
  if(!meal&&!gapOK)W.push({lvl:'caution',k:'lunch',title:`No lunch break on ${N}`,body:'Activities run straight through midday. Add a meal block so the afternoon doesn’t collapse.',fix:{l:'Add lunch break',a:'addLunch',di}})}
 if(le-fs>13*60&&!it.some(x=>x.cat==='transit'&&x.d>=240))W.push({lvl:'caution',k:'span',title:`${hm(le-fs)} day`,body:`From ${fmtT(fs)} to ${fmtT(le)}. Make sure that’s intentional.`});
 if(le>23*60)W.push({lvl:'caution',k:'late',title:'Finishes very late',body:`The last activity ends at ${fmtT(le)}.`});
 const g=acts.filter(geo);const clusters=new Set(g.map(x=>x.area));
 if(g.length>=4){const cur=pathKm(g),best=nnKm(g);if(cur-best>3&&best<cur*.75)W.push({lvl:'tip',k:'route',title:'A shorter route exists',body:`Reordering ${N} by distance saves about ${Math.round(cur-best)} km of back-and-forth (${Math.round(cur)} km → ${Math.round(best)} km).`,fix:{l:'Reorder by route',a:'route',di}})}

  idx.forEach((di,k)=>{const day=plan[di];const first=di===0,last=di===t.days-1&&t.days>1,arrive=k===0&&di>0;

function estBudget(t){const n=travellers(t),tier=t.prefs?.tier??1,rooms=Math.ceil(n/2);const b={travel:0,stay:0,food:0,local:0,act:0,shop:0,misc:0};

function newWz(pre){S.wz={step:1,dests:pre&&D[pre]?[pre]:[],start:'',days:pre&&D[pre]?D[pre].days[0]+1:4,group:'couple',n:2,names:['',''],pace:'balanced',prefs:{natureCity:0,sightExp:0,tier:1,foodShop:0,advComfort:0},bMode:'total',budget:'',name:''}}
const GROUPS=[['solo','Solo',1],['couple','Couple',2],['friends','Friends',4],['family','Family',4],['group','Group',6]];
function wzEst(w){const tmp={travelers:Array(w.n).fill('x'),prefs:w.prefs,plan:allocDays(w.dests.length?w.dests:['jaipur'],w.days).map(id=>({dest:id,items:[]}))};const b=estBudget(tmp);const fees=sum(w.dests,id=>sum(D[id].pl.filter(p=>p.must),p=>p.c))*w.n;return r500(b.stay+b.food+b.local+fees+(b.stay+b.food+b.local)*.13)}
function vNew(){const w=S.wz;const st=w.step;const T=['Where are you going?','When are you going?','Who is travelling?','What kind of trip do you want?','What’s the budget?','Ready to build'];

 if(st===1)body=`<p class="muted">Pick one destination, or a few for a multi-stop trip. Order matters: you’ll travel in the order you pick.</p><div class="grid auto" style="margin-top:16px">${DESTS.map(d=>{const i=w.dests.indexOf(d.id);return `<button class="opt ${i>=0?'on':''}" data-a="wzDest" data-v="${d.id}"><span class="row between"><b>${d.name}</b>${i>=0?`<span class="tag f">Stop ${i+1}</span>`:''}</span><span class="small muted">${d.tag}</span><span class="tiny muted">${d.days[0]}–${d.days[1]} days · ${d.bestFor}</span></button>`}).join('')}</div><p class="small" style="margin-top:14px">Haven’t decided yet? <a href="#compare">Compare destinations</a> against what you care about.</p>`;
 if(st===2){const rec=w.dests.length?[sum(w.dests,id=>D[id].days[0]),sum(w.dests,id=>D[id].days[1])]:null;const m=w.start?new Date(w.start+'T00:00:00').getMonth()+1:0;
  body=`<div class="grid g2"><label class="f">Start date<input type="date" id="wzStart" value="${w.start}"><span class="tiny muted">Leave empty if your dates are flexible. Dates unlock weekday and season checks.</span></label><div class="f" style="display:grid;gap:6px"><b class="small">Number of days</b><div class="stepper"><button data-a="wzDays" data-v="-1" aria-label="Fewer days">−</button><b>${w.days}</b><button data-a="wzDays" data-v="1" aria-label="More days">+</button></div>${rec?`<span class="tiny muted">Recommended for this route: ${rec[0]}–${rec[1]} days.</span>`:''}</div></div>
  ${rec&&w.days<rec[0]?`<div class="warn caution" style="margin-top:14px"><b>That’s tight</b><p>${w.dests.map(id=>D[id].name).join(' + ')} usually needs at least ${rec[0]} days. The planner will prioritise must-sees and leave the rest in your wishlist.</p></div>`:''}
  ${m?w.dests.filter(id=>seasonOf(D[id],m)==='poor').map(id=>`<div class="warn caution" style="margin-top:14px"><b>${MONTHS[m-1]} is off-season for ${D[id].name}</b><p>${D[id].bestTime}</p></div>`).join(''):''}`}
 if(st===3)body=`<div class="grid g3" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${GROUPS.map(([k,l])=>`<button class="opt ${w.group===k?'on':''}" data-a="wzGroup" data-v="${k}"><b>${l}</b></button>`).join('')}</div>
  <div class="row" style="margin-top:18px"><b class="small">Travellers</b><div class="stepper"><button data-a="wzN" data-v="-1" aria-label="Fewer travellers">−</button><b>${w.n}</b><button data-a="wzN" data-v="1" aria-label="More travellers">+</button></div></div>
  <div class="grid auto" style="margin-top:14px">${w.names.map((x,i)=>`<label class="f">Traveller ${i+1} name<input type="text" data-wzname="${i}" value="${esc(x)}" placeholder="${i===0?'You':'Traveller '+(i+1)}"></label>`).join('')}</div><p class="tiny muted" style="margin-top:8px">Names are used for expense splitting. Optional.</p>`;
 if(st===4){const pr=w.prefs;const pair=(k,a,b)=>`<div class="pair"><span>${a}</span><input type="range" min="-2" max="2" step="1" value="${pr[k]}" data-pref="${k}" aria-label="${a} versus ${b}"><span>${b}</span></div>`;
  body=`<div class="grid" style="gap:10px"><b class="small">Pace</b><div class="grid g3">${Object.entries(PACE).map(([k,p])=>`<button class="opt ${w.pace===k?'on':''}" data-a="wzPace" data-v="${k}"><b>${p.l}</b><span class="small muted">About ${hm(p.cap)} of activities a day, up to ${p.max} stops</span></button>`).join('')}</div></div>
  <div class="grid card" style="gap:16px;margin-top:18px">${pair('natureCity','Nature','City')}${pair('sightExp','Sightseeing','Experiences')}${pair('foodShop','Food','Shopping')}${pair('advComfort','Adventure','Comfort')}<div class="pair"><span>Budget</span><input type="range" min="0" max="2" step="1" value="${pr.tier}" data-pref="tier" aria-label="Budget versus luxury"><span>Luxury</span></div></div>`}
 if(st===5){const est=wzEst(w);body=`<div class="grid g2"><div class="grid" style="gap:12px"><div class="row"><button class="chip ${w.bMode==='total'?'on':''}" data-a="wzBMode" data-v="total">Total budget</button><button class="chip ${w.bMode==='pp'?'on':''}" data-a="wzBMode" data-v="pp">Per person</button></div>
  <label class="f">${w.bMode==='total'?'Total for the group':'Per person'} (₹)<input type="number" id="wzBudget" min="0" step="500" value="${w.budget}" placeholder="e.g. ${w.bMode==='total'?r500(est*1.2):r500(est*1.2/w.n)}"></label><p class="tiny muted">Optional. You can change it, and every category, later.</p></div>
  <div class="card"><span class="small muted">Estimated on-ground cost</span><div class="stat"><b>${inr(est)}</b><span>for ${plural(w.n,'traveller')}, ${plural(w.days,'day')} · ${inr(est/w.n)} pp</span></div><p class="tiny muted" style="margin-top:8px">Stay, food, local transport, key entry fees, plus a little for shopping and extras. Excludes your train or flight to get there.</p></div></div>`}
 if(st===6)body=`<div class="grid g2"><label class="f">Trip name<input type="text" id="wzName" value="${esc(w.name)}" placeholder="${esc(w.dests.map(id=>D[id].name).join(' + ')+' getaway')}"></label></div>
  <dl class="kv" style="margin-top:16px;font-size:15px"><dt>Route</dt><dd>${w.dests.map(id=>D[id].name).join(' → ')||'—'}</dd><dt>When</dt><dd>${w.start?fmtD(new Date(w.start+'T00:00:00')):'Flexible'} · ${plural(w.days,'day')}</dd><dt>Who</dt><dd>${GROUPS.find(g=>g[0]===w.group)[1]} · ${plural(w.n,'traveller')}</dd><dt>Pace</dt><dd>${PACE[w.pace].l}</dd><dt>Budget</dt><dd>${w.budget?inr(w.bMode==='total'?w.budget:w.budget*w.n)+' total':'Not set'}</dd></dl>
  <p class="small muted" style="margin-top:12px">You’ll get a starter itinerary, budget categories and a packing list. It’s a starting point: everything stays editable.</p>`;
 const can=st!==1||w.dests.length;
 return `<a class="small" href="#home">← Cancel</a><h1 style="margin-top:8px">Create a new trip</h1><div class="steps">${T.map((_,i)=>`<i class="${i<st?'on':''}"></i>`).join('')}</div>
 <span class="kicker">Step ${st} of 6</span><h2 style="margin:6px 0 16px">${T[st-1]}</h2>${body}
 <div class="row" style="margin-top:26px">${st>1?'<button class="btn" data-a="wzStep" data-v="-1">Back</button>':''}${st<6?`<button class="btn pri" data-a="wzStep" data-v="1" ${can?'':'disabled'}>Continue</button>`:'<button class="btn acc" data-a="wzCreate">Create my trip</button>'}</div>`}
function vMissing(){return `<div class="empty" style="margin-top:40px"><h2>That page isn’t here</h2><p>The trip may have been deleted, or the link is from another browser.</p><a class="btn pri" href="#home">Go home</a></div>`}

// ---------- schematic map ----------
function mountMap(el,data){if(!el)return;el.innerHTML=`<svg aria-label="Map of places"></svg><div class="mapctl noprint"><button data-z="1" aria-label="Zoom in">+</button><button data-z="-1" aria-label="Zoom out">−</button><button data-z="0" aria-label="Fit all" style="font-size:14px">Fit</button></div>${data.legend?`<div class="legend">${data.legend}</div>`:''}`;
 const svg=el.querySelector('svg');const pts=data.pts.filter(p=>p.lat!=null);const all=pts.concat(data.areas||[]);let v=data.view||{};
 const fit=()=>{const W=el.clientWidth||600,H=el.clientHeight||400;const src=(data.fitTo&&data.fitTo.length?data.fitTo:all);if(!src.length)return;const la=src.map(p=>p.lat),ln=src.map(p=>p.lng);const a=Math.min(...la),b=Math.max(...la),c=Math.min(...ln),d=Math.max(...ln);v.lat=(a+b)/2;v.lng=(c+d)/2;const cos=Math.cos(v.lat*Math.PI/180);const sx=(d-c)*cos*111.32,sy=(b-a)*110.57;v.s=Math.min((W-90)/Math.max(sx,.6),(H-90)/Math.max(sy,.6));v.s=Math.min(v.s,900)};
 const P=(lat,lng)=>{const W=el.clientWidth,H=el.clientHeight,cos=Math.cos(v.lat*Math.PI/180);return[W/2+(lng-v.lng)*cos*111.32*v.s,H/2-(lat-v.lat)*110.57*v.s]};
 const draw=()=>{const W=el.clientWidth,H=el.clientHeight;if(!W)return;const nice=[.1,.2,.5,1,2,5,10,20,50,100,200,500];const step=nice.find(k=>k*v.s>=90)||500;
  let g=`<rect width="${W}" height="${H}" fill="transparent"/>`;const cos=Math.cos(v.lat*Math.PI/180);
  const gx=step/(cos*111.32),gy=step/110.57;const[l0]=[v.lng-W/2/(cos*111.32*v.s)];const t0=v.lat+H/2/(110.57*v.s);
  for(let x=Math.floor(l0/gx)*gx;;x+=gx){const[px]=P(v.lat,x);if(px>W)break;g+=`<line x1="${px}" y1="0" x2="${px}" y2="${H}" stroke="currentColor" opacity=".07"/>`}
  for(let y=Math.ceil(t0/gy)*gy;;y-=gy){const[,py]=P(y,v.lng);if(py>H)break;g+=`<line x1="0" y1="${py}" x2="${W}" y2="${py}" stroke="currentColor" opacity=".07"/>`}
  if(data.layers?.area!==0)for(const a of data.areas||[]){const[x,y]=P(a.lat,a.lng);const r=Math.max(26,.9*v.s);g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--forest)" opacity=".08"/><text x="${x}" y="${y-r-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--forest)" opacity=".8" style="paint-order:stroke;stroke:var(--bg);stroke-width:4px">${esc(a.name)}</text>`}
  for(const rt of data.routes||[]){const ps=rt.pts.filter(p=>p.lat!=null).map(p=>P(p.lat,p.lng).map(n=>n.toFixed(1)).join(','));if(ps.length>1)g+=`<polyline points="${ps.join(' ')}" fill="none" stroke="${rt.col}" stroke-width="3" stroke-dasharray="6 6" opacity=".75" stroke-linecap="round"/>`}
  const ord=[...pts].sort((a,b)=>(a.id===data.sel)-(b.id===data.sel));const boxes=[];const free=(x,y,w)=>{const b=[x,y-10,x+w,y+4];if(x+w>W-56&&y<170)return false;if(boxes.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]))return false;boxes.push(b);return true};
  for(const p of ord){const[x,y]=P(p.lat,p.lng);const on=p.id===data.sel;
   if(p.kind==='stay')g+=`<g data-pin="${p.id}" style="cursor:pointer"><rect x="${x-12}" y="${y-12}" width="24" height="24" rx="6" fill="var(--ink)" stroke="var(--bg)" stroke-width="2"/><path d="M${x-6} ${y+5} v-6 l6 -5 l6 5 v6z" fill="var(--bg)"/></g>`;
   else if(p.kind==='idea')g+=`<g data-pin="${p.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${on?10:7}" fill="var(--paper)" stroke="${p.col}" stroke-width="2.5"/></g>`;
   else g+=`<g data-pin="${p.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${on?16:12}" fill="${p.col}" stroke="var(--bg)" stroke-width="2.5"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${p.num??''}</text></g>`;
   if(p.lab&&(on||data.labels)&&(on||free(x+16,y+4,p.lab.length*6.6)))g+=`<text x="${x+16}" y="${y+4}" font-size="12.5" font-weight="700" fill="var(--ink)" style="paint-order:stroke;stroke:var(--bg);stroke-width:4px;pointer-events:none">${esc(p.lab)}</text>`}
  const bw=step*v.s;g+=`<g transform="translate(${W-bw-16},${H-22})"><rect width="${bw}" height="5" fill="var(--ink)" opacity=".7"/><text x="${bw/2}" y="-6" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${step<1?step*1000+' m':step+' km'}</text></g>`;
  svg.innerHTML=g};
 if(!v.s)fit();draw();const ro=new ResizeObserver(()=>draw());ro.observe(el);
 let drag=null;svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lat:v.lat,lng:v.lng,moved:false,pin:e.target.closest('[data-pin]')?.dataset.pin};svg.setPointerCapture(e.pointerId)});
 svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(!drag.moved)return;const cos=Math.cos(v.lat*Math.PI/180);v.lng=drag.lng-dx/(cos*111.32*v.s);v.lat=drag.lat+dy/(110.57*v.s);draw()});
 svg.addEventListener('pointerup',()=>{if(drag&&!drag.moved&&drag.pin&&data.onPick)data.onPick(drag.pin);drag=null});
 el.addEventListener('wheel',e=>{e.preventDefault();v.s*=e.deltaY<0?1.2:1/1.2;v.s=Math.max(.05,Math.min(v.s,2000));draw()},{passive:false});
 el.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const z=+b.dataset.z;if(z)v.s*=z>0?1.5:1/1.5;else fit();draw()})}

function vTrip(t,tab){FIX=[];const A=analyzeTrip(t);S.A=A;const dalerts=sum(A.days,d=>d.filter(w=>w.lvl==='alert').length);

 const B={overview:tOverview,plan:tPlan,map:tMap,budget:tBudget,stays:tStays,pack:tPack,share:tShare}[tab]||tOverview;return head+B(t,A)}
function tOverview(t,A){const r=readiness(t);const all=[...A.trip.map(w=>[w,null]),...A.days.flatMap((d,i)=>d.map(w=>[w,i]))].sort((a,b)=>({alert:0,caution:1,tip:2})[a[0].lvl]-({alert:0,caution:1,tip:2})[b[0].lvl]);
 const tile=(l,v,s,href)=>`<a class="card stat" href="${href}" style="text-decoration:none;color:inherit"><span>${l}</span><b>${v}</b><span>${s}</span></a>`;
 return `<div class="row" style="gap:24px;align-items:center"><div class="ring" style="--p:${r.all}"><b>${r.all}%</b></div><div style="flex:1;min-width:240px"><h2>Travel readiness</h2><p class="muted small" style="margin-top:6px">Itinerary days without blocking issues, core budget lines filled, nights booked and bags packed.</p></div></div>
 <div class="grid g4" style="margin-top:18px">${tile('Itinerary',r.it+'%',`${plural(t.plan.filter(d=>d.items.some(isAct)).length,'day')} planned, ${plural(A.count.alert,'issue')}`,`#t-${t.id}-plan`)}${tile('Budget',r.core.length?plural(r.core.length,'gap'):'Ready',r.core.length?'Core categories to fill':'All core lines allocated',`#t-${t.id}-budget`)}${tile('Accommodation',r.booked>=r.nights?'Booked':r.pending?`${r.pending} pending`:'Not chosen',`${r.booked} of ${plural(r.nights,'night')} booked`,`#t-${t.id}-stays`)}${tile('Packing',r.pk+'%',`${t.pack.filter(x=>x.done).length} of ${t.pack.length} items`,`#t-${t.id}-pack`)}</div>
 <div class="grid g2 sec" style="align-items:start"><div class="grid" style="gap:10px"><h2>Needs attention</h2>${all.filter(([w])=>w.lvl!=='tip').slice(0,6).map(([w,i])=>warnHTML(w,i)).join('')||'<div class="warn tip"><b>Nothing blocking</b><p>The plan looks realistic. Tips appear on each day in the Itinerary tab.</p></div>'}</div>
 <div class="card grid" style="gap:12px"><h3>Trip settings</h3><label class="f">Trip name<input type="text" data-tf="name" value="${esc(t.name)}"></label>

 if(!fitTo.length)fitTo.push(...areas);
 S.mapData={pts,routes,areas,fitTo:fd==='all'&&t.dests.length>1?null:fitTo,layers:{area:L.area?1:0},labels:fd!=='all',sel:S.sel.pin};

function tBudget(t){const n=travellers(t),days=t.plan.length;const planned=sum(BCATS,([k])=>t.budget[k]);const spent=sum(t.expenses,e=>e.amt);const total=t.budgetTotal||planned;const by=k=>sum(t.expenses.filter(e=>e.cat===k),e=>e.amt);const pct=total?Math.round(spent/total*100):0;

 const actCost=sum(t.plan.flatMap(d=>d.items.filter(isAct)),x=>x.c)*n;const today=new Date().toISOString().slice(0,10);
 return `<div class="grid g4">${[['Budget',t.budgetTotal?inr(t.budgetTotal):'Not set',t.budgetTotal?`${inr(t.budgetTotal/n)} per person`:'Set it in Overview'],['Planned',inr(planned),`${inr(planned/n)} pp · ${inr(planned/days)} a day`],['Spent',inr(spent),`${pct}% of ${t.budgetTotal?'budget':'plan'}`],['Left',inr(total-spent),t.budgetTotal&&planned<t.budgetTotal?`${inr(t.budgetTotal-planned)} not yet allocated`:t.budgetTotal&&planned>t.budgetTotal?`Plan is ${inr(planned-t.budgetTotal)} over budget`:'of the plan']].map(([l,v,s])=>`<div class="card stat"><span>${l}</span><b style="${l==='Left'&&total-spent<0?'color:var(--alert)':''}">${v}</b><span>${s}</span></div>`).join('')}</div>

 <tr><td><b>Total</b></td><td class="n"><b>${inr(planned)}</b></td><td class="n"><b>${inr(spent)}</b></td><td class="n"><b>${inr(planned-spent)}</b></td><td></td></tr></tbody></table></div></section>
